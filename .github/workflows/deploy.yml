name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: article-lens-production
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://mf-article-lens.netmind-ai.workers.dev

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Validate Worker bundle
        run: npm run check:worker

  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure analysis queue exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          if ! npx wrangler queues list --config wrangler.toml \
            | grep -Eq '(^|[^[:alnum:]_-])mf-article-lens-analysis([^[:alnum:]_-]|$)'; then
            npx wrangler queues create "mf-article-lens-analysis" --config wrangler.toml
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Configure admin bootstrap secret
        env:
          ADMIN_SETTINGS_PASSWORD: ${{ secrets.ADMIN_SETTINGS_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          if [ -z "$ADMIN_SETTINGS_PASSWORD" ]; then
            echo "::error::Missing production secret ADMIN_SETTINGS_PASSWORD"
            exit 1
          fi
          printf '%s' "$ADMIN_SETTINGS_PASSWORD" \
            | npx wrangler secret put ADMIN_SETTINGS_PASSWORD --config wrangler.toml

      - name: Smoke test production
        env:
          ARTICLE_ACCESS_PASSCODE: ${{ secrets.ARTICLE_ACCESS_PASSCODE }}
        run: npm run smoke -- "$PRODUCTION_URL"
