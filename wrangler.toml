# Production Worker. Its workers.dev URL is:
# https://mf-article-lens.netmind-ai.workers.dev
name = "mf-article-lens"
main = "src/index.ts"
compatibility_date = "2026-07-26"

[assets]
directory = "public"
binding = "ASSETS"
# The Worker enforces the Article Lens access gate before serving index.html.
run_worker_first = true

[[kv_namespaces]]
binding = "CACHE"

[[durable_objects.bindings]]
name = "ANALYSIS_JOBS"
class_name = "AnalysisJob"

[[migrations]]
tag = "initial-sqlite"
new_sqlite_classes = ["AnalysisJob"]

[[queues.producers]]
binding = "ANALYSIS_TASK_QUEUE"
queue = "mf-article-lens-analysis"

[[queues.consumers]]
queue = "mf-article-lens-analysis"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 30
max_concurrency = 2

[vars]
# Origin only. The connect routes append /api/connect/a2a/... themselves, so
# this deliberately does NOT carry the /api suffix the old MF_API_URL had.
# Renaming the variable rather than reusing MF_API_URL keeps that shift loud:
# the old value here would produce a 404 that is tedious to diagnose.
MANYFOLD_API_BASE_URL = "https://api.manyfold.ai"
# 'production' turns on the https-only and private-address checks that every
# agent-supplied rpcUrl is validated against. Leave it unset for local dev so a
# loopback agent is reachable.
ENVIRONMENT = "production"
SPEC_VERSION = "15"

# Agents are no longer configured here. They arrive through the Manyfold
# connect handshake: open /settings, click Connect, approve on Manyfold, and
# assign the five roles. Until an agent is connected the app serves mock
# results. See docs/operations.md.
#
# Bootstrap /settings with:
#   npx wrangler secret put ADMIN_SETTINGS_PASSWORD --config wrangler.toml
# That password now also encrypts stored agent credentials, so rotating it
# requires reconnecting the agents.
