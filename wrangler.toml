# Production Worker. Its workers.dev URL is:
# https://mf-article-lens.netmind-ai.workers.dev
name = "mf-article-lens"
main = "src/index.ts"
compatibility_date = "2026-07-26"

[assets]
directory = "public"
binding = "ASSETS"
# The Worker enforces the Article Lens access gate before serving index.html.
run_worker_first = true

[[kv_namespaces]]
binding = "CACHE"

[[durable_objects.bindings]]
name = "ANALYSIS_JOBS"
class_name = "AnalysisJob"

[[migrations]]
tag = "initial-sqlite"
new_sqlite_classes = ["AnalysisJob"]

[[queues.producers]]
binding = "ANALYSIS_TASK_QUEUE"
queue = "mf-article-lens-analysis"

[[queues.consumers]]
queue = "mf-article-lens-analysis"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 30
max_concurrency = 2

[vars]
MF_API_URL = "https://api.manyfold.ai/api"
MF_AGENT_ID = "agt_agp2f7i4zj44pj2niaiv2aryoy"
SPEC_VERSION = "13"
AGENT_SUMMARIZER = "agt_agp2f7ggfv7lxpheoveiawvk6q"
AGENT_CONTEXT = "agt_agp2f7i7bry43ju3omvwtnngie"
AGENT_SYNTHESIZER = "agt_agp2f7jbwvyp5gkigkqxggzuay"
AGENT_COMMENT_MAP = "agt_agp2f7jd5zzdjhuggdiimhrui4"
AGENT_JARGON = "agt_agp2f7jgjn7txo663jeetsxcwu"
AGENT_COMMENT_REDUCE = "agt_agp2f7jilj42lobuzbjov7urzq"

# Bootstrap /settings with:
#   npx wrangler secret put ADMIN_SETTINGS_PASSWORD --config wrangler.toml
# Runtime values above are initial/fallback defaults. After login, /settings
# stores encrypted overrides in CACHE. MF_API_TOKEN can be entered there, or
# retained as a Wrangler secret for bootstrap/fallback compatibility.
