# Version 2 deploy target — a SEPARATE Cloudflare Worker (hn-lens-v2) with its own
# KV namespace, so V2 runs independently and never disturbs the frozen V1 (worker
# `hn-lens`, git tag `v1`). Deploy with: npm run ship:v2  (uses --config wrangler.v2.toml)
name = "hn-lens-v2"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"

# Pre-warm the front page so the first view of a top story is instant.
[triggers]
crons = ["37 */2 * * *"]

[[kv_namespaces]]
binding = "CACHE"
id = "276ed8baff904e009bd25cd4bfdca285"
preview_id = "276ed8baff904e009bd25cd4bfdca285"

[vars]
MF_API_URL = "https://api-staging.manyfold.ai/api"
MF_AGENT_ID = "agt_agpqh6zu7j2ipjtgdxyrk2skvq"
SPEC_VERSION = "13"
AGENT_SUMMARIZER = "agt_agpqh65tur7bpof744f3ocap7y"
AGENT_CONTEXT    = "agt_agpqh7synf3q5df5ysca4k4npu"
AGENT_SYNTHESIZER = "agt_agpqh7upcv6vfbug4pozts74ou"
AGENT_COMMENT_MAP = "agt_agpqh7m5c55ffmxr2vri326dgy"
AGENT_JARGON     = "agt_agpqh7bmxjy4bmnoywfrernr2q"
AGENT_COMMENT_REDUCE = "agt_agpqh7qqv53addlck44okx6dvy"

# Set via: echo "$MF_API_TOKEN" | npx wrangler secret put MF_API_TOKEN --config wrangler.v2.toml
